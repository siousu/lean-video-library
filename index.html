<style>
:root{color-scheme:dark;--bg:#0c0f0d;--bg2:#131815;--card:#171d19;--line:#232b26;--tx:#e9efe9;--mut:#93a097;--acc:#a3e635;--acc2:#84cc16;--onacc:#0c0f0d;--hdr:rgba(12,15,13,.82);--hl:#36423a;--hb:#161c18;--kbd:#0f1311;--soft:#1c2a12;--softl:#2f4417;--softx:#a3e635;--pl1:#1f2b17;--pl2:#141a16;--ov:rgba(4,6,5,.6);--pal:#121714;--pall:#2a342d;--ph:#6d7a71;--x:#1d2520;--act:#1d2620;--au:#c3d0c6;--sh:0 30px 80px rgba(0,0,0,.6);--mark:#a3e635;

html{transition:background-color .2s}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:2400px;margin:0 auto;padding:0 clamp(8px,2.2vw,32px)}
header.top{position:sticky;top:0;z-index:20;background:var(--hdr);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-decoration:none}
.logo{flex:none;width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#a3e635,#22c55e);display:grid;place-items:center}
.logo svg{width:16px;height:16px}
.brand h1{font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;color:var(--mut);font-size:12px;font-weight:450}
.sbtn{display:flex;align-items:center;gap:10px;height:40px;min-width:280px;padding:0 10px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);cursor:pointer;transition:border-color .15s,background .15s}
.sbtn:hover,.ibtn:hover{border-color:var(--hl);background:var(--hb)}
.ibtn{flex:none;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mut);cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.ibtn:hover{color:var(--tx)}
.ibtn svg{width:18px;height:18px}
.ibtn .sun{display:none}
:root[data-theme=dark] .ibtn .sun{display:block}
:root[data-theme=dark] .ibtn .moon{display:none}
.sbtn svg{width:17px;height:17px;flex:none}
.sbtn span{flex:1;text-align:left}
kbd{font:500 11.5px/1 var(--font);padding:4px 6px;border-radius:6px;border:1px solid var(--line);background:var(--kbd);color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;color:var(--mut);cursor:pointer;white-space:nowrap;transition:all .15s}
.chip b{font-weight:500;opacity:.65;margin-left:4px;font-size:12px}
.chip:hover{color:var(--tx);border-color:var(--hl)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}

.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 0 12px;color:var(--mut);font-size:13.5px}

.qpill button{border:0;background:var(--softl);border-radius:999px;width:20px;height:20px;cursor:pointer;line-height:1;color:var(--softx)}
#grid{position:relative;contain:strict;width:100%}
.t{position:absolute;top:0;left:0;display:block;text-decoration:none;border-radius:var(--r);outline:none}
.th{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;background:var(--card);border:1px solid var(--line)}

.th .pl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:8px;font-size:12px;color:var(--mut);background:radial-gradient(120% 120% at 0% 0%,var(--pl1),var(--pl2))}

.play svg{width:12px;height:12px;margin-left:2px}
.t:hover .th img,.t:focus-visible .th img{transform:scale(1.045)}
.t:hover .play,.t:focus-visible .play{opacity:1;transform:none}
.t:focus-visible .th{outline:2px solid var(--acc);outline-offset:2px}
.cap{padding:8px 2px 0}
.ti{font-size:13.5px;font-weight:550;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;height:2.6em;color:var(--tx)}
.au{font-size:12px;color:var(--au);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}

.tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);color:var(--tx);font-size:13px;cursor:pointer;max-width:240px}
.tbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn.on{border-color:var(--softl);color:var(--softx);background:var(--soft)}

.ri .rt.av{display:grid;place-items:center;background:linear-gradient(135deg,var(--pl1),var(--pl2));color:var(--softx);font-weight:700;font-size:15px}

/* palette */
.ov{position:fixed;inset:0;z-index:50;background:var(--ov);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px 16px}

.pvau[disabled]{cursor:default;opacity:.7}
.pva{display:flex;align-items:center;gap:8px;flex:none}
.ytb{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:10px;background:#ff0033;color:#fff;font-size:14px;font-weight:650;text-decoration:none;white-space:nowrap;box-shadow:0 2px 10px rgba(255,0,51,.25)}

.pvx{position:fixed;top:14px;right:16px;z-index:2}
.pvn{position:fixed;top:50%;margin-top:-23px;width:46px;height:46px;transition:background .15s,box-shadow .15s;box-shadow:0 4px 18px rgba(0,0,0,.35);border-radius:50%;border:1px solid rgba(255,255,255,.18);background:rgba(20,24,21,.6);color:#fff;display:grid;place-items:center;cursor:pointer}

.pvp{left:14px}.pvnx{right:14px}

.pvbar{display:none}
.pv.open{animation:fadei .2s ease-out}

@keyframes fadei{from{opacity:0}}

<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="/" aria-label="Home">

        <span style="min-width:0"><h1>Lean, Farming &amp; Innovation</h1><small id="sub">Video Library · loading…</small></span>

      <button class="sbtn" id="openPal" aria-label="Search videos">

        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>

  <button class="pvn pvnx" id="pvn" aria-label="Next video (→)" title="Next (→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>

    </div>

  </div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const fmt=n=>n.toLocaleString('en-US');
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
if(!isMac)$('#kbd').textContent='Ctrl K';
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const YT=/^[A-Za-z0-9_-]{11}$/;
let C=[],A=[],V=[],view=[],cat=-1,sub=-1,au=-1,sort='src',query='';

// ---------- theme ----------
const root=document.documentElement;
function setTheme(t,save){root.dataset.theme=t;$('#tc').content=t==='light'?'#f5f6f2':'#0c0f0d';
  const b=$('#themeBtn');const lbl=t==='light'?'Switch to dark mode':'Switch to light mode';b.setAttribute('aria-label',lbl);b.title=lbl;b.setAttribute('aria-pressed',t==='light');
  if(save)try{localStorage.setItem('theme',t)}catch(e){}}
function toggleTheme(){setTheme(root.dataset.theme==='light'?'dark':'light',true)}
setTheme(root.dataset.theme||'dark',false);
$('#themeBtn').onclick=toggleTheme;
matchMedia('(prefers-color-scheme: light)').addEventListener('change',e=>{let s=null;try{s=localStorage.getItem('theme')}catch(_){}if(!s)setTheme(e.matches?'light':'dark',false)});

// ---------- data ----------
fetch('/data.json').then(r=>r.json()).then(d=>{
  C=d.c;A=d.a.map((a,i)=>({i,n:a[0],u:a[1],k:0,nn:norm(a[0])}));
  V=d.v.map((v,i)=>{
    const yt=YT.test(v[0]),a=v[2],cats=[];
    for(let k=0;k<a.length;k+=2)cats.push([a[k],a[k+1]]);
    const label=cats.map(([c,s])=>C[c][1][s]==='General'?C[c][0]:C[c][1][s]).join(' · ');
    let host='';if(!yt){try{host=new URL(v[0]).hostname.replace(/^www\.|^video\./,'')}catch(e){}}
    const au=v[3]>=0?A[v[3]]:null;if(au)au.k++;
    return {i,id:v[0],t:v[1],yt,cats,label,res:v[5]===1,host,au:v[3],an:au?au.n:'',na:au?au.nn:'',
      url:yt?'https://www.youtube.com/watch?v='+v[0]:v[0],
      img:yt?'https://i.ytimg.com/vi/'+v[0]+'/mqdefault.jpg':'',
      nt:norm(v[1]),nx:norm((v[4]||'')+' '+cats.map(([c,s])=>C[c][0]+' '+C[c][1][s]).join(' '))};
  });
  const nVid=V.filter(v=>!v.res).length;
  $('#sub').textContent=fmt(nVid)+' videos · Video Library';
  const k=new URLSearchParams(location.search).get('v');
  readURL();renderChips();apply();
  if(k){const v=findKey(k);if(v&&playable(v))openPlayer(v,view,false)}
});

// ---------- search ----------
function search(q,limit){
  const toks=norm(q).split(/\s+/).filter(Boolean);
  if(!toks.length)return [];
  const out=[];
  for(const v of V){
    let sc=0,ok=true;
    for(const t of toks){
      const p=v.nt.indexOf(t);
      if(p>=0){sc+=p===0?30:(v.nt.charCodeAt(p-1)===32?18:10);continue}
      if(v.na.indexOf(t)>=0){sc+=6;continue}
      if(v.nx.indexOf(t)>=0){sc+=3;continue}
      ok=false;break;
    }
    if(ok)out.push([sc-v.nt.length/200,v]);
  }
  if(!out.length&&toks.join('').length>2){ // fuzzy fallback: subsequence on title
    const q2=toks.join('');
    for(const v of V){
      let j=0,gaps=0,last=-1;const s=v.nt;
      for(let k=0;k<s.length&&j<q2.length;k++){if(s[k]===q2[j]){if(last>=0)gaps+=k-last-1;last=k;j++}}
      if(j===q2.length&&gaps<q2.length*4)out.push([-gaps,v]);
    }
  }
  out.sort((a,b)=>b[0]-a[0]);
  return out.map(x=>x[1]);
}
function hl(t,q){
  const toks=norm(q).split(/\s+/).filter(Boolean);if(!toks.length)return esc(t);
  const n=norm(t);const m=new Array(t.length).fill(0);
  for(const k of toks){let p=n.indexOf(k);while(p>=0){for(let i=p;i<p+k.length;i++)m[i]=1;p=n.indexOf(k,p+k.length)}}
  let o='',on=0;for(let i=0;i<t.length;i++){if(m[i]&&!on){o+='<mark>';on=1}if(!m[i]&&on){o+='</mark>';on=0}o+=esc(t[i])}
  return on?o+'</mark>':o;
}

// ---------- filters ----------
function count(c,s){let n=0;for(const v of V)for(const a of v.cats)if(a[0]===c&&(s<0||a[1]===s)){n++;break}return n}
function renderChips(){
  const el=$('#cats');
  let h=`<button class="chip${cat<0?' on':''}" data-c="-1">All<b>${fmt(V.length)}</b></button>`;
  C.forEach((c,i)=>{h+=`<button class="chip${cat===i?' on':''}" data-c="${i}">${esc(c[0])}<b>${fmt(count(i,-1))}</b></button>`});
  el.innerHTML=h;
  const se=$('#subs');
  if(cat>=0&&C[cat][1].length>1){
    let s=`<button class="chip${sub<0?' on':''}" data-s="-1">All topics</button>`;
    C[cat][1].forEach((n,i)=>{const k=count(cat,i);if(k)s+=`<button class="chip${sub===i?' on':''}" data-s="${i}">${esc(n)}<b>${fmt(k)}</b></button>`});
    se.innerHTML=s;se.hidden=false;
  }else{se.hidden=true;se.innerHTML=''}
  const on=el.querySelector('.on');if(on&&on.scrollIntoView&&cat>=0)on.scrollIntoView({block:'nearest',inline:'nearest'});
}
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;cat=+b.dataset.c;sub=-1;renderChips();apply();scrollTo({top:0})});
$('#subs').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;sub=+b.dataset.s;renderChips();apply();scrollTo({top:0})});

function apply(){
  let list=query?search(query):V;
  if(cat>=0)list=list.filter(v=>v.cats.some(a=>a[0]===cat&&(sub<0||a[1]===sub)));
  if(au>=0)list=list.filter(v=>v.au===au);
  if(sort!=='src'||query){const L=list.slice();const col=new Intl.Collator('en',{sensitivity:'base',numeric:true});
    if(sort==='title')L.sort((a,b)=>col.compare(a.t,b.t));
    else if(sort==='author')L.sort((a,b)=>(a.an?0:1)-(b.an?0:1)||col.compare(a.an,b.an)||col.compare(a.t,b.t));
    list=L}
  view=list;
  const st=$('#status');
  let h=`<span><strong>${fmt(view.length)}</strong> ${view.length===1?'entry':'entries'}</span>`;
  if(query)h+=`<span class="qpill">“${esc(query)}”<button id="clr" aria-label="Clear search">✕</button></span>`;
  if(au>=0)h+=`<span class="qpill">${esc(A[au].n)}<button id="clra" aria-label="Remove author filter">✕</button></span>`;
  h+=`<span class="tools"><button class="tbtn${au>=0?' on':''}" id="auBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>${au>=0?esc(A[au].n):'All authors'}</span></button><label class="tbtn sel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg><select id="sort" aria-label="Sort order"><option value="src">${query?'Relevance':'Source order'}</option><option value="title">Title A–Z</option><option value="author">Author A–Z</option></select></label></span>`;
  st.innerHTML=h;
  if(query)$('#clr').onclick=()=>{query='';apply()};
  if(au>=0)$('#clra').onclick=()=>{au=-1;apply()};
  $('#auBtn').onclick=()=>openPal('@');
  const se=$('#sort');se.value=sort;se.onchange=()=>{sort=se.value;apply();scrollTo({top:0})};
  $('#empty').hidden=view.length>0;
  writeURL();layout(true);
}
function readURL(){const p=new URLSearchParams(location.search);query=p.get('q')||'';cat=p.has('k')?+p.get('k'):-1;sub=p.has('t')?+p.get('t'):-1;if(!(cat in C))cat=-1,sub=-1;const a=p.get('author')||p.get('autor');au=a?A.findIndex(x=>x.n===a):-1;sort=['title','author'].includes(p.get('sort'))?p.get('sort'):'src'}
function writeURL(){const p=new URLSearchParams();if(query)p.set('q',query);if(cat>=0)p.set('k',cat);if(sub>=0)p.set('t',sub);if(au>=0)p.set('author',A[au].n);if(sort!=='src')p.set('sort',sort);if(pCur)p.set('v',vkey(pCur));const s=p.toString();history.replaceState(pPushed?{pv:1}:null,'',s?'?'+s:location.pathname)}

// ---------- virtual grid ----------
const grid=$('#grid');let cols=3,tw=0,th=0,gap=16,top0=0,nodes=new Map(),lastRange='';
function layout(reset){
  const w=grid.clientWidth,mob=innerWidth<720;
  gap=mob?6:(w>1600?18:16);
  cols=mob?3:Math.max(2,Math.floor((w+gap)/(210+gap)));
  tw=(w-gap*(cols-1))/cols;
  const capH=mob?50:84; // title (2 lines) + meta
  th=tw*9/16+2+capH;
  const rows=Math.ceil(view.length/cols);
  grid.style.height=Math.max(0,rows*(th+gap)-gap)+'px';
  if(reset){for(const n of nodes.values())n.remove();nodes.clear()}
  lastRange='';draw();
}
function tile(v){
  const a=document.createElement('a');a.className='t';a.href=v.url;a.target='_blank';a.rel='noopener noreferrer';a.setAttribute('role','listitem');a.title=v.t;
  const thumb=v.yt?`<img src="${v.img}" alt="" loading="lazy" decoding="async" width="320" height="180" onload="this.classList.add('ld')" onerror="this.classList.add('ld')">`
    :`<div class="pl"><div><em>${v.res?'Resource':'Video'}</em>${esc(v.host)}</div></div>`;
  a.innerHTML=`<div class="th">${thumb}<span class="play"><svg viewBox="0 0 12 12"><path d="M2 1l9 5-9 5z" fill="#fff"/></svg></span></div><div class="cap"><div class="ti">${esc(v.t)}</div><div class="au">${esc(v.an||'Unknown')}</div><div class="ca">${esc(v.label)}</div></div>`;
  return a;
}
function draw(){
  const r=grid.getBoundingClientRect();top0=r.top+scrollY;
  const vh=innerHeight,rowH=th+gap;
  const first=Math.max(0,Math.floor((scrollY-top0-vh*.6)/rowH));
  const last=Math.min(Math.ceil(view.length/cols)-1,Math.floor((scrollY-top0+vh*1.6)/rowH));
  const key=first+':'+last+':'+cols+':'+view.length;if(key===lastRange)return;lastRange=key;
  const s=first*cols,e=Math.min(view.length,(last+1)*cols);
  for(const [i,n] of nodes)if(i<s||i>=e){n.remove();nodes.delete(i)}
  const frag=document.createDocumentFragment();
  for(let i=s;i<e;i++){
    let n=nodes.get(i);
    if(!n){n=tile(view[i]);n._v=view[i];nodes.set(i,n);frag.appendChild(n)}
    const c=i%cols,row=(i/cols)|0;
    n.style.width=tw+'px';n.style.transform=`translate(${c*(tw+gap)}px,${row*(th+gap)}px)`;
  }
  grid.appendChild(frag);
}
let raf=0;addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw()})},{passive:true});
let rw=innerWidth;addEventListener('resize',()=>{if(innerWidth!==rw||true){rw=innerWidth;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{raf=0;layout(false)})}});

// ---------- palette ----------
const ov=$('#ov'),qi=$('#q'),res=$('#res');let hits=[],act=0,shown=0,palAll=[];
function openPal(pre){ov.classList.add('open');qi.value=typeof pre==='string'?pre:query;qi.focus();qi.select();runPal();document.body.style.overflow='hidden'}
function closePal(){ov.classList.remove('open');document.body.style.overflow=''}
function authorHits(q){const t=norm(q).trim();if(!t)return A.slice();return A.filter(a=>a.nn.includes(t)).sort((x,y)=>(y.nn.startsWith(t)-x.nn.startsWith(t))||y.k-x.k)}
function runPal(){
  const raw=qi.value,q=raw.trim();
  if(q.startsWith('@')){ // author list
    const aq=q.slice(1);const ah=authorHits(aq);hits=ah.map(a=>({author:a}));act=0;
    $('#showAll').disabled=true;$('#showAll').textContent=`${fmt(ah.length)} authors`;
    res.innerHTML=(au>=0&&!aq?`<a class="ri" data-i="-1" data-clear="1"><span class="rt av">✕</span><span class="rx"><div>Remove author filter</div><small>Show all authors</small></span></a>`:'')+
      (ah.length?ah.map((a,i)=>authRow(a,i,aq)).join(''):'<div class="hint">No author found.</div>');
    if(au>=0&&!aq){hits.unshift({clear:1})}
    setAct(0);res.scrollTop=0;return;
  }
  if(!q){hits=[];res.innerHTML=`<div class="hint">Type to search ${fmt(V.length)} videos and ${fmt(A.length)} authors – e.g. “5S”, “Kaizen”, “chicken”, “Paul Akers”. Type <b>@</b> to list all authors, <b>&gt;</b> or “theme” to toggle light/dark mode.</div>`;$('#showAll').disabled=true;$('#showAll').textContent='All results in grid';return}
  const ah=authorHits(q).slice(0,3);
  const cmd=/^(theme|light|dark|mode|toggle|night|day|>)/i.test(q)||/(theme|dark mode|light mode)/i.test(q);
  hits=search(q);palAll=hits;act=0;shown=Math.min(hits.length,60);
  $('#showAll').disabled=!hits.length;$('#showAll').textContent=hits.length?`All ${fmt(hits.length)} results in grid`:'No results';
  if(!hits.length&&!ah.length&&!cmd){res.innerHTML='<div class="hint">No results.</div>';return}
  const tot=hits.length,vh=hits.slice(0,shown);hits=(cmd?[{cmd:'theme'}]:[]).concat(ah.map(a=>({author:a})),vh);
  res.innerHTML=(cmd?'<div class="grp">Commands</div>'+cmdRow():'')+(ah.length?'<div class="grp">Authors</div>'+ah.map((a,i)=>authRow(a,i,q)).join(''):'')+(vh.length?'<div class="grp">Videos</div>':'')+vh.map((v,j)=>{const i=j+ah.length;return `<a class="ri" role="option" data-i="${i}" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer"><span class="rt">${v.yt?`<img src="${v.img}" alt="" decoding="async">`:''}</span><span class="rx"><div>${hl(v.t,q)}</div><small>${hl(v.an||'Unknown',q)} · ${esc(v.label)}</small></span><span class="go">${v.res||!playable(v)?'open ↗':'play ▶'}</span></a>`}).join('')+(tot>shown?`<div class="hint" style="padding:12px">+ ${fmt(tot-shown)} more – <b>⇧ ↵</b> shows all in the grid</div>`:'');
  setAct(0);res.scrollTop=0;
}
function cmdRow(){const l=root.dataset.theme==='light';return `<a class="ri" role="option"><span class="rt av">${l?'☾':'☀'}</span><span class="rx"><div>${l?'Switch to dark mode':'Switch to light mode'}</div><small>Command · toggle light/dark mode</small></span><span class="go">run ↵</span></a>`}
function authRow(a,i,q){return `<a class="ri" role="option" data-i="${i}"><span class="rt av">${esc(a.n.replace(/[^\p{L}\p{N}]/gu,'').slice(0,2).toUpperCase()||'?')}</span><span class="rx"><div>${hl(a.n,q.replace(/^@/,''))}</div><small>Author · ${fmt(a.k)} ${a.k===1?'Video':'Videos'}</small></span><span class="go">filter ↵</span></a>`}
function pick(i){const h=hits[i];if(!h)return;if(h.cmd){toggleTheme();runPal();return}if(h.clear){au=-1;apply();closePal();return}if(h.author){au=h.author.i;query='';cat=-1;sub=-1;renderChips();apply();closePal();scrollTo({top:0});return}closePal();openPlayer(h,palAll,true)}
function setAct(i){const items=res.querySelectorAll('.ri');if(!items.length)return;act=(i+items.length)%items.length;items.forEach((el,k)=>el.classList.toggle('act',k===act));if(i!==0||act)items[act].scrollIntoView({block:'nearest'})}
function showAll(){query=qi.value.trim();cat=-1;sub=-1;au=-1;sort='src';renderChips();apply();closePal();scrollTo({top:0})}
qi.addEventListener('input',runPal);
qi.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){e.preventDefault();setAct(act+1)}
  else if(e.key==='ArrowUp'){e.preventDefault();setAct(act-1)}
  else if(e.key==='Enter'){e.preventDefault();if((e.shiftKey||!hits.length)&&!qi.value.trim().startsWith('@')){if(qi.value.trim())showAll();return}pick(act)}
});
res.addEventListener('click',e=>{const r=e.target.closest('.ri');if(!r)return;const h=hits[act=+[...res.querySelectorAll('.ri')].indexOf(r)];if(h&&(h.author||h.clear||h.cmd||!(e.metaKey||e.ctrlKey||e.shiftKey||e.button))){e.preventDefault();pick(act)}});
res.addEventListener('mousemove',e=>{const r=e.target.closest('.ri');if(!r)return;const k=[...res.querySelectorAll('.ri')].indexOf(r);if(k!==act)setAct(k)});
$('#showAll').onclick=showAll;
$('#openPal').onclick=()=>openPal();$('#closePal').onclick=closePal;
ov.addEventListener('mousedown',e=>{if(e.target===ov)closePal()});
addEventListener('keydown',e=>{
  if(pv.classList.contains('open')){if(e.key==='Escape'){e.preventDefault();closePlayer()}else if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}else if(e.key==='ArrowRight'){e.preventDefault();step(1)}return}
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ov.classList.contains('open')?closePal():openPal()}
  else if(e.key==='Escape'&&ov.classList.contains('open')){closePal()}
  else if(e.key==='/'&&!ov.classList.contains('open')&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();openPal()}
});
// ---------- player overlay ----------
const pv=$('#pv'),pvf=$('#pvf'),pvo=$('#pvo');
const YTI='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8z"/><path fill="#ff0033" d="M9.6 15.6 15.8 12 9.6 8.4z"/></svg>';
const EXT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const PLAT={'ted.com':'TED','vimeo.com':'Vimeo','facebook.com':'Facebook','c-span.org':'C-SPAN','foxbusiness.com':'Fox Business'};
function platform(v){if(v.yt)return 'YouTube';for(const k in PLAT)if(v.host.endsWith(k))return PLAT[k];return v.host||'source'}
function embedUrl(v){
  if(v.yt)return `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&playsinline=1&modestbranding=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}`;
  let u;try{u=new URL(v.id)}catch(e){return null}
  const h=u.hostname.replace(/^www\./,'');
  if(h==='vimeo.com'){const m=u.pathname.match(/^\/(\d+)/);return m?`https://player.vimeo.com/video/${m[1]}?autoplay=1&dnt=1`:null}
  if(h==='ted.com'){const m=u.pathname.match(/^\/talks\/([^/.?#]+)/);return m?`https://embed.ted.com/talks/${m[1]}`:null}
  if(h==='facebook.com'&&/\/videos\//.test(u.pathname))return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(v.id)}&show_text=false&autoplay=1`;
  return null;
}
const vkey=v=>v.yt?v.id:'x'+v.i;
const playable=v=>!v.res&&!!embedUrl(v);
let pList=[],pIdx=-1,pCur=null,pPushed=false,pTime=0,pRet=null;
function openPlayer(v,list,push){
  if(!playable(v)){window.open(v.url,'_blank','noopener');return}
  pList=list&&list.includes(v)?list:(view.includes(v)?view:[v]);
  if(pv.classList.contains('closing')){clearTimeout(ct);pv.classList.remove('open','closing');pvb.style.transition='';pvb.style.transform=''}
  if(!pv.classList.contains('open')){pRet=document.activeElement;pv.classList.add('open');document.documentElement.style.overflow='hidden';document.body.style.overflow='hidden'}
  show(v);
  const p=new URLSearchParams(location.search);p.set('v',vkey(v));
  if(push&&!pPushed){history.pushState({pv:1},'','?'+p);pPushed=true}else history.replaceState(pPushed?{pv:1}:null,'','?'+p);
  $('#pvx').focus({preventScroll:true});
}
function show(v){
  pCur=v;pTime=0;pIdx=pList.indexOf(v);
  // skip-able neighbours: only playable ones count
  pvf.innerHTML=(v.yt?`<img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="">`:'')+
    `<iframe src="${esc(embedUrl(v))}" title="${esc(v.t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`+
    `<div class="pverr" id="pverr"><p>This video can't be played here – the creator has disabled embedding or it is no longer available.</p><a class="ytb" href="${esc(v.url)}" target="_blank" rel="noopener noreferrer">${YTI}Watch on YouTube</a></div>`;
  const fr=pvf.querySelector('iframe');
  if(v.yt)fr.addEventListener('load',()=>{try{fr.contentWindow.postMessage(JSON.stringify({event:'listening',id:'pv',channel:'widget'}),'*')}catch(e){}});
  $('#pvh').textContent=v.t;
  const b=$('#pvau');b.textContent=v.an||'Unknown author';b.disabled=v.au<0;
  $('#pvcat').textContent=v.label;
  const pl=platform(v);pvo.className='ytb'+(v.yt?'':' gen');pvo.innerHTML=(v.yt?YTI:EXT)+'Open on '+esc(pl);pvo.href=v.url;
  pvo.setAttribute('aria-label','Open on '+pl+' (new tab)');
  const c=pList.length>1?`${fmt(pIdx+1)} / ${fmt(pList.length)}`:'';$('#pvc').textContent=c;$('#pvc2').textContent=c;
  const hp=nb(-1)>=0,hn=nb(1)>=0;['#pvp','#pvp2'].forEach(s=>$(s).disabled=!hp);['#pvn','#pvn2'].forEach(s=>$(s).disabled=!hn);
  requestAnimationFrame(placeNav);
}
function placeNav(){const p=$('#pvp'),n=$('#pvn');if(!pv.classList.contains('open')||getComputedStyle(p).display==='none'&&getComputedStyle(n).display==='none')return;
  const W=innerWidth,b=$('#pvb').getBoundingClientRect(),fr=$('#pvf').getBoundingClientRect(),L=b.left,R=b.right,cy=fr.top+fr.height/2,g=20,s=46;
  p.style.left=Math.max(8,L-g-s)+'px';n.style.left=Math.min(W-8-s,R+g)+'px';n.style.right='auto';p.style.top=n.style.top=cy+'px'}
addEventListener('resize',()=>requestAnimationFrame(placeNav));$('#pvb').addEventListener('animationend',placeNav);
function nb(d){for(let i=pIdx+d,n=0;i>=0&&i<pList.length&&n<50;i+=d,n++)if(playable(pList[i]))return i;return -1}
function step(d){const i=nb(d);if(i<0)return;const v=pList[i];show(v);const p=new URLSearchParams(location.search);p.set('v',vkey(v));history.replaceState(pPushed?{pv:1}:null,'','?'+p)}
let ct=0;const pvb=$('#pvb');
function teardown(){pvf.innerHTML='';pCur=null;
  const fin=()=>{pv.classList.remove('open','closing');pvb.style.transition='';pvb.style.transform=''};
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches){pv.classList.add('closing');if(matchMedia('(max-width:719px)').matches){pvb.style.transition='transform .26s cubic-bezier(.4,0,1,1)';pvb.style.transform='translateY(110%)'}clearTimeout(ct);ct=setTimeout(fin,250)}else fin();document.documentElement.style.overflow='';document.body.style.overflow='';if(pRet&&pRet.focus&&document.contains(pRet))pRet.focus({preventScroll:true});pRet=null}
function closePlayer(){if(!pCur)return;teardown();if(pPushed){pPushed=false;history.back()}else writeURL()}
addEventListener('popstate',()=>{
  const k=new URLSearchParams(location.search).get('v');
  if(!k){pPushed=false;if(pCur)teardown();writeURL();return}
  const v=findKey(k);if(v){pPushed=!!(history.state&&history.state.pv);openPlayer(v,pList.length?pList:view,false)}
});
function findKey(k){if(YT.test(k))return V.find(v=>v.id===k);if(/^x\d+$/.test(k))return V[+k.slice(1)];return null}
addEventListener('message',e=>{
  if(!pCur||!pCur.yt||!/^https:\/\/www\.youtube(-nocookie)?\.com$/.test(e.origin))return;
  let d;try{d=typeof e.data==='string'?JSON.parse(e.data):e.data}catch(_){return}
  if(!d)return;
  if(d.event==='onError'){const er=$('#pverr');if(er)er.classList.add('on')}
  else if(d.event==='infoDelivery'&&d.info&&typeof d.info.currentTime==='number')pTime=d.info.currentTime;
});
pvo.addEventListener('click',()=>{if(pCur&&pCur.yt){pvo.href=pCur.url+(pTime>3?'&t='+Math.floor(pTime)+'s':'')}
  try{fr0().contentWindow.postMessage(JSON.stringify({event:'command',func:'pauseVideo',args:[]}),'*')}catch(e){}});
const fr0=()=>pvf.querySelector('iframe');
$('#pvau').onclick=()=>{const v=pCur;if(!v||v.au<0)return;closePlayer();au=v.au;query='';cat=-1;sub=-1;renderChips();apply();scrollTo({top:0})};
$('#pvx').onclick=closePlayer;$('#pvx2').onclick=closePlayer;
$('#pvp').onclick=$('#pvp2').onclick=()=>step(-1);$('#pvn').onclick=$('#pvn2').onclick=()=>step(1);
pv.addEventListener('click',e=>{if(e.target===pv)closePlayer()});
let tx=0,ty=0,ax=0,dy=0,dx=0;
pvb.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;ax=0;dx=dy=0},{passive:true});
pvb.addEventListener('touchmove',e=>{dx=e.touches[0].clientX-tx;dy=e.touches[0].clientY-ty;
  if(!ax&&Math.hypot(dx,dy)>8)ax=Math.abs(dy)>Math.abs(dx)?'y':'x';
  if(ax==='y'&&dy>0&&pvb.scrollTop<=0&&matchMedia('(max-width:719px)').matches){e.preventDefault();pvb.style.transition='none';pvb.style.transform=`translateY(${dy}px)`}},{passive:false});
pvb.addEventListener('touchend',()=>{
  if(ax==='y'&&pvb.style.transform){if(dy>110)closePlayer();else{pvb.style.transition='transform .25s cubic-bezier(.2,.9,.25,1)';pvb.style.transform=''}}
  else if(ax==='x'&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)step(dx<0?1:-1)},{passive:true});
pv.addEventListener('keydown',e=>{if(e.key==='Tab'){const f=[...pv.querySelectorAll('button:not([disabled]),a[href],iframe')].filter(x=>x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});
grid.addEventListener('click',e=>{const a=e.target.closest('a.t');if(!a||e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button)return;const v=a._v;if(!v||!playable(v))return;e.preventDefault();openPlayer(v,view,true)});
let prec=0;grid.addEventListener('pointerover',()=>{if(prec)return;prec=1;for(const h of['https://www.youtube-nocookie.com','https://i.ytimg.com']){const l=document.createElement('link');l.rel='preconnect';l.href=h;document.head.appendChild(l)}},{passive:true});
})();
</script>
</body>
</html>
